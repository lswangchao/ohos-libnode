name: CI

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Node.js tag to build'
        required: true
        default: 'v24.2.0'

permissions: write-all

jobs:
  build-libnode:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        run: |
          V="${{ github.event.inputs.version }}"
          if [ -z "$V" ]; then V="v24.2.0"; fi
          echo "VERSION=$V" >> $GITHUB_ENV
          echo "will build Node.js $V"

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y build-essential unzip jq

      - name: Restore build cache
        uses: actions/cache/restore@v4
        with:
          path: out-cache
          key: node242-out-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            node242-out-

      - name: Build
        run: bash build.sh ${{ env.VERSION }}

      - name: Mark cache worthy
        if: always()
        run: |
          SIZE=$(du -sm node/out 2>/dev/null | cut -f1 || echo 0)
          echo "out/ size: $SIZE MB"
          if [ "$SIZE" -gt 500 ]; then echo "CACHE_WORTHY=1" >> $GITHUB_ENV; fi

      - name: Save build cache
        if: always() && env.CACHE_WORTHY == '1'
        uses: actions/cache/save@v4
        with:
          path: node/out
          key: node242-out-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Show artifacts
        run: |
          echo "--- output dir ---"
          ls -lh libnode-ohos-arm64.tar.gz
          tar -tzf libnode-ohos-arm64.tar.gz | head -20
          tar -tzf libnode-ohos-arm64.tar.gz | wc -l

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libnode-ohos-arm64
          path: libnode-ohos-arm64.tar.gz
          retention-days: 7

      - name: Publish to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="ohos-libnode-${VERSION}"
          ASSET="libnode-${VERSION}-ohos-arm64.tar.gz"
          cp libnode-ohos-arm64.tar.gz "$ASSET"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "libnode.so $VERSION (OpenHarmony arm64)" --notes "auto build"
          gh release upload "$TAG" "$ASSET" --repo "$GITHUB_REPOSITORY" --clobber
